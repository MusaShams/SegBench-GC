algorithm: adaptive_iql
goal_sampling_mode: official
value_p_curgoal: 0.2
value_p_trajgoal: 0.5
value_p_randomgoal: 0.3
value_geom_sample: true
actor_p_curgoal: 0.0
actor_p_trajgoal: 0.5
actor_p_randomgoal: 0.5
actor_geom_sample: false
gc_negative: true
horizons: [1, 2, 4, 8]
chunk_size: 1
action_chunk_size: 1
batch_size: 1024
learning_rate: 0.0003
gate_learning_rate: 0.0003
hidden_dim: 512
hidden_layers: 3
activation: gelu
layer_norm: true
gate_hidden_dim: 128
discount: 0.99
expectile: 0.9
actor_loss_mode: ddpgbc
actor_alpha: 0.003
target_tau: 0.005
uncertainty_penalty: 0.25
horizon_value_weight: 0.25
horizon_value_mode: per_step
horizon_penalty: 0.0
horizon_prior_center: 4
horizon_prior_penalty: 0.25
gate_target_smoothing: 0.0
gate_entropy_regularization: 0.0
gate_selection_strategy: argmax
actor_horizon_weighting: gate
gate_execution_strategy: mixture
support_temperature: 0.1
cross_horizon_consistency_weight: 0.03
