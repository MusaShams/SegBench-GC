algorithm: adaptive_iql
horizons: [1, 2, 4, 8]
chunk_size: 1
action_chunk_size: 1
batch_size: 1024
learning_rate: 0.0003
gate_learning_rate: 0.0003
hidden_dim: 512
hidden_layers: 3
activation: gelu
layer_norm: true
gate_hidden_dim: 128
discount: 0.99
expectile: 0.9
actor_loss_mode: ddpgbc
actor_alpha: 0.003
target_tau: 0.005
uncertainty_penalty: 0.25
horizon_value_weight: 0.25
horizon_value_mode: per_step
horizon_penalty: 0.0
horizon_prior_center: 4
horizon_prior_penalty: 0.25
gate_target_smoothing: 0.2
gate_entropy_regularization: 0.01
gate_selection_strategy: sample
actor_horizon_weighting: gate
gate_execution_strategy: mixture
static_horizon_weights: [0.05, 0.05, 0.05, 0.85]
